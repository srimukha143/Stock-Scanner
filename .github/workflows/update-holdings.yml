# Publishes the scanner to GitHub Pages with today's holdings files included,
# so it can be opened from any phone or computer without running anything.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

name: Update holdings

on:
  # 14:05 UTC = 9:05 am in New Jersey while clocks are on EST (Nov-Mar).
  # GitHub's clock ignores daylight saving, so from mid-March this same line
  # lands at 10:05 am; change the 14 to a 13 then to put it back to 9:05 am.
  # GitHub also starts scheduled jobs when its queue has room rather than on
  # the minute, so expect the run itself to begin some time after 9.
  schedule:
    - cron: "5 14 * * *"      # once a day, 9:05 am New Jersey (winter)
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write    # needed by the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download today's holdings files
        run: |
          mkdir -p site
          cp index.html site/
          python server.py --download site/data || echo "No files downloaded; publishing the site anyway"

      # These five actions are GitHub's own. Their versions must be kept current:
      # an old deploy-pages cannot read the artifact a current runner produces, which
      # fails with 'No artifacts named "github-pages" were found'.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

      # GitHub switches off scheduled jobs after 60 days with no commits to the
      # repository. This job only ever runs itself, so it commits a timestamp
      # every Sunday to reset that clock. "[skip ci]" stops the commit starting
      # another run.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" != "7" ]; then
            echo "Not Sunday - no keep-alive commit needed today."
            exit 0
          fi
          # Date only, so later runs the same day produce no change and no commit.
          date -u +"Last automatic run: %Y-%m-%d" > last-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git diff --staged --quiet || git commit -m "Keep schedule alive [skip ci]"
          git push
