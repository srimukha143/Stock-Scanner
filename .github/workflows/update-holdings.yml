# Downloads the 14 daily holdings files and publishes the scanner, so it can be
# opened from any phone or computer without running anything.
#
# This version publishes by committing the finished site to a branch called
# gh-pages, instead of using GitHub's Pages upload/deploy actions, which kept
# failing with 'No artifacts named "github-pages" were found'.
#
# One-time setup: repo Settings -> Pages -> Source: "Deploy from a branch",
# Branch: "gh-pages", folder "/ (root)". Do that AFTER this file's first run,
# because the gh-pages branch has to exist before it appears in the list.

name: Update holdings

on:
  # 14:05 UTC = 9:05 am in New Jersey while clocks are on EST (Nov-Mar).
  # GitHub's clock ignores daylight saving, so from mid-March this same line
  # lands at 10:05 am; change the 14 to a 13 then to put it back to 9:05 am.
  # GitHub also starts scheduled jobs when its queue has room rather than on
  # the minute, so expect the run itself to begin some time after 9.
  schedule:
    - cron: "5 14 * * *"      # once a day, 9:05 am New Jersey (winter)
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write             # the job publishes by pushing a branch

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download today's holdings files
        run: |
          mkdir -p site
          cp index.html site/
          python server.py --download site/data || echo "No files downloaded; publishing the site anyway"

      - name: Check the site was built
        run: |
          test -s site/index.html || { echo "site/index.html is missing or empty"; exit 1; }
          echo "Files to publish:"; find site -type f | head -30
          echo "Total: $(find site -type f | wc -l) files"

      - name: Publish the site to the gh-pages branch
        run: |
          cd site
          touch .nojekyll          # stop GitHub trying to run Jekyll over the files
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Holdings update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Published. The site updates within a minute or two."

      # GitHub switches off scheduled jobs after 60 days with no commits to the
      # repository, so this commits a timestamp every Sunday to reset that clock.
      # "[skip ci]" stops the commit starting another run.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" != "7" ]; then
            echo "Not Sunday - no keep-alive commit needed today."
            exit 0
          fi
          # Date only, so later runs the same day produce no change and no commit.
          date -u +"Last automatic run: %Y-%m-%d" > last-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git diff --staged --quiet || git commit -m "Keep schedule alive [skip ci]"
          git push
