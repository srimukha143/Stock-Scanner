# Publishes the scanner to GitHub Pages with today's holdings files included,
# so it can be opened from any phone or computer without running anything.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

name: Update holdings

on:
  # Times are UTC. 7:00 am New York time is 11:00 UTC in summer and 12:00 UTC in
  # winter, so both are listed; only the one matching the season lands at 7:00 am,
  # and the other runs an hour before or after.
  schedule:
    - cron: "0 11 * * *"      # 7:00 am every day (summer)
    - cron: "0 12 * * *"      # 7:00 am every day (winter)
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download today's holdings files
        run: |
          mkdir -p site
          cp index.html site/
          python server.py --download site/data || echo "No files downloaded; publishing the site anyway"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
