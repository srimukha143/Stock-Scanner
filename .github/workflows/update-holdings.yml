# Publishes the scanner to GitHub Pages with today's holdings files included,
# so it can be opened from any phone or computer without running anything.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

name: Update holdings

on:
  # GitHub runs scheduled jobs when its queue has room, not when asked: on this
  # repository they have been landing 6 to 10 hours late. A single daily time is
  # therefore unreliable, so this runs every 4 hours and whichever attempt gets
  # through keeps the page current. Each run takes about 20 seconds. The odd
  # minute avoids the top of the hour, which is the most congested moment.
  schedule:
    - cron: "17 */4 * * *"    # 00:17, 04:17, 08:17, 12:17, 16:17, 20:17 UTC
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write    # needed by the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download today's holdings files
        run: |
          mkdir -p site
          cp index.html site/
          python server.py --download site/data || echo "No files downloaded; publishing the site anyway"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub switches off scheduled jobs after 60 days with no commits to the
      # repository. This job only ever runs itself, so it commits a timestamp
      # every Sunday to reset that clock. "[skip ci]" stops the commit starting
      # another run.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" != "7" ]; then
            echo "Not Sunday - no keep-alive commit needed today."
            exit 0
          fi
          # Date only, so later runs the same day produce no change and no commit.
          date -u +"Last automatic run: %Y-%m-%d" > last-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git diff --staged --quiet || git commit -m "Keep schedule alive [skip ci]"
          git push
